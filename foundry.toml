# Release metadata, not foundry config. `rainix-autopublish` reads `version` as
# the next, unpublished Soldeer release and rewrites the line when it publishes.
# `[external.*]` is the section foundry reserves for another tool's config and
# ignores.
[external.package]
name = "rain-extrospection"
version = "0.1.8"

[profile.default]

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

solc = "0.8.25"
optimizer = true
optimizer_runs = 100000
evm_version = "cancun"

bytecode_hash = "none"
cbor_metadata = false
libs = ["dependencies"]

[fuzz]
runs = 2048

[dependencies]
forge-std = "1.16.1"
"rain-solmem" = "0.1.3"
"rain-math-binary" = "0.1.4"

[soldeer]
recursive_deps = false

# `arbitrum` backs the fork tests
# (`test/src/lib/LibExtrospectBytecode.checkCBORTrimmedBytecodeHash.fork.t.sol`).
[rpc_endpoints]
arbitrum = "${ARBITRUM_RPC_URL}"
