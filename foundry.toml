[profile.default]

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

solc = "0.8.25"
optimizer = true
optimizer_runs = 100000
evm_version = "cancun"

bytecode_hash = "none"
cbor_metadata = false
libs = ["dependencies"]

# The fixture exists to put SELFDESTRUCT in compiled bytecode.
ignored_warnings_from = ["test/concrete/HasSelfdestruct.sol"]

[fuzz]
runs = 2048

[dependencies]
forge-std = "1.17.0"
"rain-solmem" = "0.1.28"
"rain-math-binary" = "0.1.4"
rain-factory = "0.2.12"
"rain-deploy" = "0.1.32"
rain-metadata = "0.1.46"
rain-datacontract = "0.2.1"

[soldeer]
recursive_deps = false

# `arbitrum` backs the fork tests
# (`test/src/lib/LibExtrospectBytecode.checkCBORTrimmedBytecodeHash.fork.t.sol`).
[rpc_endpoints]
arbitrum = "${ARBITRUM_RPC_URL}"
